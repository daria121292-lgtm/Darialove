<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Открыть рабочий план</title><style>body{margin:0;padding:40px 20px;background:#f3f5f7;color:#28343b;font:16px/1.6 Arial,sans-serif}main{max-width:620px;padding:30px;margin:10vh auto;background:white;border-radius:16px}h1{font-size:26px;line-height:1.3}#status{overflow-wrap:anywhere}</style></head><body><main><h1>Рабочий план</h1><p id="status" role="status" aria-live="polite">Открываем календарь…</p><noscript>Для открытия календаря нужен JavaScript. Откройте полную ссылку из чата в браузере.</noscript></main><script>
(async()=>{'use strict';try{const token=new URLSearchParams(location.hash.slice(1)).get('key');if(!token)throw new Error('missing');const b=token.replace(/-/g,'+').replace(/_/g,'/');const raw=Uint8Array.from(atob(b+'='.repeat((4-b.length%4)%4)),c=>c.charCodeAt(0));if(raw.length!==32)throw new Error('key');const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const response=await fetch('plan.bin',{cache:'no-store',referrerPolicy:'no-referrer'});if(!response.ok)throw new Error('fetch');const packed=new Uint8Array(await response.arrayBuffer());if(new TextDecoder().decode(packed.slice(0,5))!=='UXPK1')throw new Error('format');const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:packed.slice(5,17),additionalData:new TextEncoder().encode('ux-materials-v1:plan')},key,packed.slice(17));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();}catch(e){document.getElementById('status').textContent=e.message==='missing'?'Откройте полную ссылку из чата, включая часть после #.':'Не удалось открыть план. Проверьте полноту ссылки и попробуйте обычный браузер.';}})();
</script></body></html>
