<div class="breadcrumb"><span>Главная</span><b>›</b><span>Рейсы</span><b>›</b><span id="crumb-current">Создание рейса</span></div>
<main id="workspace"></main>
</div></div>

<script>'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n);
const TODAY='2026-10-22', STORAGE='ux-trip-v8-draft-1';
const ORIGINS={central:{name:'Склад «Центральный»',kind:'CD',address:'Москва, Складская ул., 10',office:'Транспортный отдел «Центральный»',tz:'3'},north:{name:'Склад «Северный»',kind:'FF',address:'Москва, Северная ул., 12',office:'Транспортный отдел «Северный»',tz:'3'}};
const POINTS={khimki:{name:'Химки · перевалочный склад',address:'Химки, Складской проезд, 6'},podolsk:{name:'Подольск · перевалочный склад',address:'Подольск, Складская ул., 12'},east:{name:'Балашиха · перевалочный склад',address:'Балашиха, Транспортная ул., 4'}};
const PEOPLE={maria:{name:'Мария Соколова',phone:'+7 900 000-00-01',email:'m.sokolova@example.com',number:'100201',company:'example',org:'central'},oleg:{name:'Олег Петров',phone:'+7 900 000-00-02',email:'o.petrov@example.com',number:'100202',company:'example',org:'north'},anna:{name:'Анна Смирнова',phone:'+7 900 000-00-03',email:'a.smirnova@example.com',number:'100203',company:'partner',org:'partner-logistics'}};
const COMPANIES={example:{name:'ООО «Пример»',inn:'0000000000',kpp:'000000000',orgs:{central:'Склад «Центральный»',north:'Склад «Северный»',logistics:'Отдел логистики'}},partner:{name:'ООО «Демо Партнёр»',inn:'0000000001',kpp:'000000001',orgs:{'partner-logistics':'Отдел логистики'}}};
const VEHICLES={small:{name:'До 1,5 т · 10 м³',kg:1500,m3:10,length:3},medium:{name:'До 3 т · 18 м³',kg:3000,m3:18,length:4},large:{name:'До 5 т · 30 м³',kg:5000,m3:30,length:6}};
const CARRIERS={contract:'Перевозчик по договору',reserve:'Резервный перевозчик по договору'};
const DATA=Array.from({length:660},(_,i)=>{
 const n=i+1,city=n<=50?'Люберцы':n<=120?'Химки':n<=200?'Подольск':['Балашиха','Мытищи','Люберцы','Химки','Подольск'][i%5];
 const current=n<=650?'central':'north',address=city+', ул. Центральная, '+(1+i%4);
 return {n,id:'PROCS-261022-'+String(n).padStart(4,'0'),doc:'П'+String(735662700+Math.floor(i/5)),current,created:i%3?'ff':'local',city,address,recipient:['Иван Кузнецов','Елена Орлова','Андрей Морозов','Ольга Иванова'][i%4],status:n>=641&&n<=650?'Собирается':'Упакована',otherTrip:n>=621&&n<=640?'Р-2026-0142':null,date:n<=200||n>620?TODAY:'2026-10-23',kg:2+i%5,m3:Math.round((.01+(i%4)*.005)*1000)/1000};
});
const BYID=new Map(DATA.map(d=>[d.id,d]));
const DOCS=new Map();for(const d of DATA){if(!DOCS.has(d.doc))DOCS.set(d.doc,[]);DOCS.get(d.doc).push(d);}
const params=new URLSearchParams(location.search);
let example=params.get('example')||'start',pointMode=params.get('pointMode')==='responsible'?'responsible':'directory';
let state,modalKind='',modalIDs=[],pasteResult=null,serviceDraft=null,toastTimer=null,formErrors={},editingSnapshot=null;
const clone=o=>JSON.parse(JSON.stringify(o));
function blankState(){return {screen:'compose',status:'draft',editing:false,origin:'central',members:{},selected:[],sourceSelection:[],list:{q:'',route:'',page:1,size:10},source:{q:'',city:'',date:TODAY,view:'all',warehouse:'central',page:1,size:50},pickups:[],returnTo:'central',services:{},notice:null,error:'',undo:null,version:0,request:null,simulateError:false,form:{name:'',nameTouched:false,date:TODAY,time:'09:00',tz:'3',vehicle:'small',vehicleTouched:false,carrier:'contract',tariff:'normal',loading:'front',customer:'maria',company:'example',org:'central',comment:'',fastening:false,urgent:false,oversize:false,length:'',valuable:false,value:'',temperature:false,tempMin:'',tempMax:''}};}
function reset(which='start'){
 example=which;state=blankState();editingSnapshot=null;formErrors={};
 const n=which==='blank'?0:which==='large'?600:['distributed','requested','accepted'].includes(which)?200:50;
 for(const d of DATA.slice(0,n)){state.members[d.id]=n===50?{mode:'unset',point:null,owner:null}:d.n<=50?{mode:'direct',point:null,owner:null}:{mode:'via',point:d.n<=120?'khimki':d.n<=200?'podolsk':['khimki','podolsk','east'][d.n%3],owner:pointMode==='responsible'?(d.n%2?'maria':'oleg'):null};}
 autoFields();
 if(which==='requested'||which==='accepted'){state.status=which;state.version=1;state.request=makePayload();state.screen='receipt';}
 $('example').value=which;render();
}
const rows=()=>DATA.filter(d=>Object.hasOwn(state.members,d.id));
function blockReason(d){return d.otherTrip?'В другом рейсе':d.status!=='Упакована'?'Ещё не упакована':d.current!==state.origin?'Другой склад отправления':'';}
const canAdd=d=>!Object.hasOwn(state.members,d.id)&&!blockReason(d);
const routeKey=a=>a.mode==='via'?'via:'+a.point+':'+(a.owner||''):a.mode;
const routeTitle=a=>a.mode==='unset'?'Не распределены':a.mode==='direct'?'Напрямую':POINTS[a.point]?.name||'Укажите пункт';
const needsOwner=a=>a.mode==='via'&&pointMode==='responsible'&&!a.owner;
const unsetIds=()=>Object.entries(state.members).filter(([,a])=>a.mode==='unset'||needsOwner(a)).map(([id])=>id);
const outbound=()=>rows().reduce((a,d)=>({kg:a.kg+d.kg,m3:a.m3+d.m3}),{kg:0,m3:0});
const inbound=()=>state.pickups.reduce((a,p)=>({kg:a.kg+Number(p.kg),m3:a.m3+Number(p.m3)}),{kg:0,m3:0});
function requiredLoad(){const a=outbound(),b=inbound();return {kg:Math.max(a.kg,b.kg),m3:Math.max(a.m3,b.m3)};}
function recommend(){const a=requiredLoad();return Object.keys(VEHICLES).find(k=>VEHICLES[k].kg>=a.kg&&VEHICLES[k].m3+1e-6>=a.m3&&(!state.form.oversize||!state.form.length||VEHICLES[k].length>=Number(state.form.length)))||null;}
function autoFields(){if(!state.form.nameTouched){const cities=[...new Set(rows().map(d=>d.city))];state.form.name=ORIGINS[state.origin].name.replace('Склад ','')+' — '+(cities.length?cities.slice(0,3).join(', ')+(cities.length>3?' и ещё '+(cities.length-3):''):state.pickups.length?'вывоз ТМЦ':'новый рейс');}if(!state.form.vehicleTouched)state.form.vehicle=recommend()||'large';}
function groups(){const result=new Map();for(const d of rows()){const a=state.members[d.id],key=routeKey(a);if(!result.has(key))result.set(key,{key,a,ids:[]});result.get(key).ids.push(d.id);}return [...result.values()].sort((a,b)=>(a.a.mode==='unset'?0:a.a.mode==='direct'?1:2)-(b.a.mode==='unset'?0:b.a.mode==='direct'?1:2)||a.key.localeCompare(b.key));}
function stops(){
 const result=[{key:'origin:'+state.origin,name:ORIGINS[state.origin].name+' · '+ORIGINS[state.origin].kind,address:ORIGINS[state.origin].address,kind:rows().length?'Погрузка':'Выезд со склада',count:rows().length}];
 const buckets=new Map();
 for(const d of rows()){const a=state.members[d.id];if(a.mode==='unset')continue;const key=a.mode==='via'?'point:'+a.point:'delivery:'+d.address;if(!buckets.has(key))buckets.set(key,{key,name:a.mode==='via'?POINTS[a.point].name:d.city,address:a.mode==='via'?POINTS[a.point].address:d.address,kind:a.mode==='via'?'Передача на перевалочном пункте':'Доставка получателям',count:0});buckets.get(key).count++;}
 result.push(...buckets.values());
 state.pickups.forEach(p=>result.push({key:'pickup:'+p.key,name:p.name,address:p.address,kind:'Вывоз ТМЦ',count:0}));
 if(state.pickups.length)result.push({key:'return:'+state.returnTo,name:ORIGINS[state.returnTo].name,address:ORIGINS[state.returnTo].address,kind:'Возврат с собранным грузом',count:0});
 return result;
}
const activeServices=()=>Object.fromEntries(stops().filter(s=>state.services[s.key]&&(state.services[s.key].workers>0||state.services[s.key].hydro)).map(s=>[s.key,state.services[s.key]]));
function localTime(){const [y,m,d]=state.form.date.split('-');return d&&m?`${d}.${m}.${y}, ${state.form.time}`:'Укажите дату и время';}
const tzLabel=()=>state.form.tz==='3'?'Москва · UTC+3':'Екатеринбург · UTC+5';
function notify(text,error=false){$('toast').textContent=text;$('toast').classList.toggle('error',error);$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,5000);}
function message(text,type='success'){state.notice={text,type};render();}
function persist(show=false){try{localStorage.setItem(STORAGE,JSON.stringify({version:1,state,pointMode,editingSnapshot}));if(show)notify('Черновик сохранён в этом браузере.');}catch{if(show)notify('Браузер не разрешил сохранение. Скачайте прототип или оставьте вкладку открытой.',true);}}
function setScreen(screen){state.screen=screen;state.error='';state.selected=[];render();window.scrollTo({top:0,behavior:'instant'});$('page-title')?.focus({preventScroll:true});}
function option(value,label,current){return `<option value="${esc(value)}"${value===current?' selected':''}>${esc(label)}</option>`;}
function field(name,label,{type='text',required=false,options=null,full=false,hint='',extra=''}={}){const id='form-'+name,value=state.form[name];return `<label class="field${full?' full':''}"><span>${required?'<b class="required">•</b>':''}${label}</span>${options?`<select id="${id}" data-form="${name}"${formErrors[name]?' class="invalid" aria-invalid="true"':''}>${options.map(([k,v])=>option(k,v,value)).join('')}</select>`:`<input id="${id}" type="${type}" data-form="${name}" value="${esc(value)}" ${extra}${formErrors[name]?' class="invalid" aria-invalid="true"':''}>`}${formErrors[name]?`<span class="field-error" role="alert">${esc(formErrors[name])}</span>`:''}${hint?`<small>${hint}</small>`:''}</label>`;}
function noticeHTML(){return state.error?`<div class="notice danger" role="alert"><div>${esc(state.error)}</div><button data-action="dismiss-error" aria-label="Скрыть сообщение">×</button></div>`:state.notice?`<div class="notice${state.notice.type==='warning'?' amber':''}" role="status"><div>${esc(state.notice.text)}</div><div>${state.undo?'<button data-action="undo">Вернуть</button>':''}<button data-action="dismiss-notice" aria-label="Скрыть сообщение" style="margin-left:12px">×</button></div></div>`:'';}
function header(title,description,back=''){
 const status=state.status==='accepted'?'<span class="badge green">Принята в работу</span>':state.status==='requested'?'<span class="badge green">Заявка отправлена</span>':'<span class="badge">Черновик</span>';
 return `${back?`<button class="back" data-action="${back}">← ${back==='back-compose'?'К доставкам и маршруту':'К текущему рейсу'}</button>`:''}<header class="heading"><div><div class="eyebrow">Рейс Р-000128 ${status}${state.editing?'<span class="badge amber">Изменения не отправлены</span>':''}</div><h1 id="page-title" tabindex="-1">${title}</h1><p>${description}</p></div><div class="heading-actions">${state.editing?'<button class="outline" data-action="discard-edits">Отменить изменения</button>':''}${state.screen==='receipt'?'':'<button class="outline" data-action="save-draft">Сохранить черновик</button>'}</div></header>`;
}
function summary(){
 const a=outbound(),b=inbound(),un=unsetIds().length,via=rows().filter(d=>state.members[d.id].mode==='via').length,serv=Object.keys(activeServices()).length,p=PEOPLE[state.form.customer];
 return `<aside class="aside card" aria-label="Сводка рейса"><h2>В этом рейсе</h2><div class="stat-line major"><span>Доставки</span><strong id="summary-count">${rows().length}</strong></div><div class="stat-line"><span>Вес к отправке</span><strong id="summary-weight">${nf(a.kg)} кг</strong></div><div class="stat-line"><span>Объём к отправке</span><strong id="summary-volume">${nf(a.m3)} м³</strong></div>${state.pickups.length?`<div class="stat-line"><span>Забрать обратно</span><strong>${nf(b.kg)} кг · ${nf(b.m3)} м³</strong></div>`:''}<hr><div class="stat-line"><span>Напрямую</span><strong>${rows().filter(d=>state.members[d.id].mode==='direct').length}</strong></div><div class="stat-line"><span>Через пункт</span><strong>${via}</strong></div>${un?`<div class="stat-line"><span>Нужно распределить</span><strong style="color:var(--amber)">${un}</strong></div>`:''}<div class="stat-line"><span>Остановки участка</span><strong>${un?'Уточняются':rows().length||state.pickups.length?stops().length:0}</strong></div><div class="stat-line"><span>Услуги назначены</span><strong>${serv?serv+' точк.':'Не требуются'}</strong></div>${state.screen==='details'||state.screen==='receipt'?`<hr><p class="aside-label">Подача транспорта</p><div class="clock" id="summary-time">${esc(localTime())}</div><p class="small-p">${tzLabel()}</p><p class="small-p">${esc(ORIGINS[state.origin].address)}</p><hr><p class="aside-label">Транспорт</p><p class="person">${VEHICLES[state.form.vehicle].name}</p>`:''}<hr><div style="display:flex;justify-content:space-between;gap:12px"><p class="aside-label">Заказчик</p>${state.screen!=='receipt'?'<button class="text-button" data-action="customer-open" style="font-size:11px">Изменить</button>':''}</div><p class="person">${p.name}</p><p class="small-p">${COMPANIES[state.form.company].name}<br>${COMPANIES[state.form.company].orgs[state.form.org]}</p><hr><p class="hint">${state.status==='accepted'?'Изменения согласуйте с транспортным отделом.':state.screen==='compose'?'Транспорт подберём после распределения доставок. Вес и объём уже рассчитаны по грузу.':'Состав рейса можно изменить, вернувшись к доставкам. Введённые данные сохранятся.'}</p></aside>`;
}
function originCard(){const o=ORIGINS[state.origin];return `<section class="card origin-card"><div class="origin-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13M7 21v-9h10v9M3 9h18M10 16h4"/></svg></div><div class="origin-main"><h2>Откуда отправляем</h2><p>${o.name} <span class="badge">${o.kind}</span> · ${o.address}</p><small>${o.office}</small></div><button data-action="origin-open">Изменить</button></section>`;}
function compositionRows(){const f=state.list,q=f.q.trim().toLocaleUpperCase('ru');return rows().filter(d=>{const a=state.members[d.id];const pathMatches=!f.route?true:f.route==='unset'?a.mode==='unset'||needsOwner(a):f.route==='direct'?a.mode==='direct':a.point===f.route;return pathMatches&&(!q||`${d.id} ${d.doc} ${d.address} ${d.recipient}`.toLocaleUpperCase('ru').includes(q));});}
function sourceRows(){const f=state.source,q=f.q.trim().toLocaleUpperCase('ru');return DATA.filter(d=>(!q||`${d.id} ${d.doc} ${d.address} ${d.recipient}`.toLocaleUpperCase('ru').includes(q))&&(!f.city||d.city===f.city)&&(!f.date||d.date===f.date)&&(!f.warehouse||d.current===f.warehouse)&&(f.view==='all'||f.view==='available'&&canAdd(d)||f.view==='added'&&Object.hasOwn(state.members,d.id)||f.view==='blocked'&&!!blockReason(d))).sort((a,b)=>(canAdd(a)?0:Object.hasOwn(state.members,a.id)?1:2)-(canAdd(b)?0:Object.hasOwn(state.members,b.id)?1:2)||a.n-b.n);}
function pageRows(list,f){f.page=Math.max(1,Math.min(f.page,Math.ceil(list.length/f.size)||1));return list.slice((f.page-1)*f.size,f.page*f.size);}
function check(ids,selected,kind,label){const n=ids.filter(id=>selected.includes(id)).length;return `<input type="checkbox" id="${kind}-all" data-check="${kind}-page" aria-label="${esc(label)}"${ids.length&&n===ids.length?' checked':''}${n&&n<ids.length?' data-mixed="true"':''}${ids.length?'':' disabled'}>`;}
function membership(d){return Object.hasOwn(state.members,d.id)?'<span class="badge green">В этом рейсе</span>':d.otherTrip?`<span class="badge">В другом рейсе</span><span class="cell-sub">${d.otherTrip}</span>`:blockReason(d)?`<span class="badge amber">${blockReason(d)}</span>`:'<span class="muted">Можно добавить</span>';}
function deliveryRow(d,source=false){const a=state.members[d.id],picked=(source?state.sourceSelection:state.selected).includes(d.id);return `<tr${picked?' class="selected"':''} data-delivery="${d.id}"><td class="check"><input type="checkbox" id="${source?'source':'member'}-${d.id}" data-check="${source?'source':'member'}" data-id="${d.id}" aria-label="Выбрать ${d.id}"${picked?' checked':''}${source&&!canAdd(d)?' disabled':''}></td><td><button class="id-link" data-action="delivery-open" data-id="${d.id}">${d.id}</button><span class="cell-sub">Документ ${d.doc}</span></td>${source?`<td>${ORIGINS[d.current].name}<span class="cell-sub">${d.created==='ff'?'Создана на FF · груз на '+ORIGINS[d.current].kind:'Создана на этом складе'}</span></td>`:''}<td>${d.address}<span class="cell-sub">${d.recipient}</span></td><td class="data-col">${nf(d.kg)} кг<span class="cell-sub">${nf(d.m3)} м³</span></td>${source?`<td><span class="badge${d.status==='Упакована'?'':' amber'}">${d.status}</span><span class="cell-sub">${d.date.split('-').reverse().join('.')}</span></td><td>${membership(d)}</td>`:`<td><button class="route-link${a.mode==='unset'?' unset':''}" data-action="row-route" data-id="${d.id}">${a.mode==='via'?'Через '+POINTS[a.point].name.split(' · ')[0]:a.mode==='unset'?'Указать путь':routeTitle(a)}</button>${a.owner?'<span class="cell-sub">'+PEOPLE[a.owner].name+'</span>':''}</td>`}</tr>`;}
function pager(list,f,kind){const pages=Math.ceil(list.length/f.size)||1;return `<div class="pager"><span>${list.length?(f.page-1)*f.size+1:0}–${Math.min(f.page*f.size,list.length)} из ${list.length}</span><div class="pager-controls"><label for="${kind}-size">На странице</label><select id="${kind}-size" data-size="${kind}">${[10,25,50,100].map(n=>option(String(n),n,String(f.size))).join('')}</select><button data-action="page-prev" data-kind="${kind}" aria-label="Предыдущая страница"${f.page===1?' disabled':''}>‹</button><span>${f.page} / ${pages}</span><button data-action="page-next" data-kind="${kind}" aria-label="Следующая страница"${f.page===pages?' disabled':''}>›</button></div></div>`;}
function composeTable(){

 return `<div class="search-row"><label><span class="sr-only">Поиск в рейсе</span><input id="member-query" data-filter="list.q" value="${esc(state.list.q)}" placeholder="Номер доставки, документа, адрес или получатель"></label><label class="sr-only" for="member-route">Как поедут</label><select id="member-route" data-filter="list.route">${option('','Все доставки',state.list.route)}${option('unset','Не распределены',state.list.route)}${option('direct','Напрямую',state.list.route)}${Object.entries(POINTS).map(([k,p])=>option(k,'Через '+p.name.split(' · ')[0],state.list.route)).join('')}</select></div><div class="selection${state.selected.length?'':' quiet'}"><div>${state.selected.length?`Выбрано <b>${state.selected.length}</b>${hidden?`<small>${hidden} скрыто фильтрами</small>`:''}`:'Выберите доставки, чтобы назначить им общий путь'}</div><div class="actions"><button data-action="select-members-all"${ids.length?'':' disabled'}>Выбрать все ${ids.length}</button>${state.selected.length?`<button data-action="route-selected">Указать путь</button><button data-action="remove-selected" class="danger-text">Убрать из рейса</button><button data-action="clear-members">Снять выбор</button>`:''}</div></div><div class="table-wrap"><table class="delivery-table"><caption class="sr-only">Доставки текущего рейса</caption><thead><tr><th class="check">${check(page.map(d=>d.id),state.selected,'member','Выбрать доставки на этой странице')}</th><th class="id-col">Доставка и документ</th><th>Куда и получатель</th><th class="data-col">Груз</th><th class="route-col">Как поедет</th></tr></thead><tbody>${page.map(d=>deliveryRow(d)).join('')}</tbody></table>${all.length?'':'<div class="empty">По этим условиям доставок нет.</div>'}</div>${pager(all,state.list,'member')}`;

 if(el.dataset.form&&['text','number','time','date'].includes(el.type)||el.dataset.form&&el.tagName==='TEXTAREA'){
  setForm(el.dataset.form,el);if(state.screen==='details')document.querySelector('.aside').outerHTML=summary();return;
 }
 if(el.dataset.service){const key=el.dataset.key;if(!serviceDraft[key])serviceDraft[key]={workers:0,hydro:false};serviceDraft[key][el.dataset.service]=el.type==='checkbox'?el.checked:Number(el.value);}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='example'){reset(el.value);return;}
 if(el.id==='point-mode'){pointMode=el.value;closeDialog();render();notify(pointMode==='responsible'?'Для пути через пункт нужен ответственный.':'Ответственный на пункте необязателен.');return;}
 if(el.dataset.form){const name=el.dataset.form;setForm(name,el);if(el.tagName==='SELECT'||['checkbox','radio'].includes(el.type)){const id=el.id;render();if(id)restoreFocus(id);else document.querySelector('[data-form="'+name+'"]'+(el.type==='radio'?':checked':''))?.focus({preventScroll:true});}else{el.classList.remove('invalid');el.removeAttribute('aria-invalid');if(state.screen==='details')document.querySelector('.aside').outerHTML=summary();}return;}
 if(el.dataset.filter){changeFilter(el.dataset.filter,el.value);render();return;}
 if(el.dataset.size){const f=el.dataset.size==='source'?state.source:state.list;f.size=Number(el.value);f.page=1;render();return;}
 if(el.dataset.check){
  const kind=el.dataset.check,isSource=kind.startsWith('source'),key=isSource?'sourceSelection':'selected',set=new Set(state[key]);let ids=[];
  if(kind.endsWith('-page')){const list=isSource?sourceRows():compositionRows(),f=isSource?state.source:state.list;ids=pageRows(list,f).filter(d=>!isSource||canAdd(d)).map(d=>d.id);}else ids=[el.dataset.id];
  for(const id of ids)if(el.checked)set.add(id);else set.delete(id);state[key]=[...set];const id=el.id;render();restoreFocus(id);return;
 }
 if(el.name==='path'){$('via-fields').hidden=el.value!=='via';$('dialog-error').hidden=true;return;}
 if(el.id==='route-point'){const p=POINTS[el.value];$('point-address').hidden=!p;$('point-address').textContent=p?.address||'';return;}
 if(el.id==='quick-company'){$('quick-org').innerHTML=Object.entries(COMPANIES[el.value].orgs).map(([k,v])=>option(k,v,'')).join('');return;}
 if(el.id==='quick-customer'){const p=PEOPLE[el.value];$('quick-contact').textContent=p.phone+' · '+p.email;return;}
 if(el.id==='origin-choice'){const o=ORIGINS[el.value];$('origin-readout').innerHTML=o.address+'<br>'+o.office;return;}
 if(el.dataset.service){const key=el.dataset.key;if(!serviceDraft[key])serviceDraft[key]={workers:0,hydro:false};serviceDraft[key][el.dataset.service]=el.type==='checkbox'?el.checked:Number(el.value);}
});
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
 switch(action){
  case 'close-dialog':closeDialog();break;
  case 'dismiss-error':state.error='';render();break;
  case 'dismiss-notice':state.notice=null;render();break;
  case 'save-draft':persist(true);break;
  case 'source-open':state.error='';setScreen('source');break;
  case 'back-compose':setScreen('compose');break;
  case 'source-select-all':state.sourceSelection=[...new Set([...state.sourceSelection,...sourceRows().filter(canAdd).map(d=>d.id)])];render();break;
  case 'source-clear':state.sourceSelection=[];render();break;
  case 'source-reset':state.source={q:'',city:'',date:'',view:'all',warehouse:state.origin,page:1,size:50};render();break;
  case 'source-add':sourceAdd();break;
  case 'page-prev':case 'page-next':{const f=el.dataset.kind==='source'?state.source:state.list;f.page+=action==='page-next'?1:-1;render();break;}
  case 'select-members-all':state.selected=[...new Set([...state.selected,...compositionRows().map(d=>d.id)])];render();break;
  case 'clear-members':state.selected=[];render();break;
  case 'row-route':routeOpen([el.dataset.id]);break;
  case 'route-selected':routeOpen(state.selected);break;
  case 'route-group':routeOpen(groups().find(g=>g.key===el.dataset.key)?.ids||[]);break;
  case 'route-apply':routeApply();break;
  case 'remove-selected':removeSelected();break;
  case 'remove-confirm':removeConfirm();break;
  case 'undo':if(state.undo?.kind==='members'){Object.assign(state.members,state.undo.previous);state.undo=null;message('Доставки и их назначения возвращены.');}break;
  case 'paste-open':pasteOpen();break;
  case 'paste-check':pasteCheck();break;
  case 'paste-add':pasteAdd();break;
  case 'paste-sample':$('paste-input').value=DATA.slice(50,200).map(d=>d.id).join('\n');invalidatePaste();break;
  case 'paste-mixed':$('paste-input').value=[DATA[50].id,DATA[50].id,DATA[51].id,DATA[0].id,DATA[620].id,DATA[640].id,DATA[650].id,DATA[50].doc,'НЕИЗВЕСТНЫЙ-НОМЕР'].join('\n');invalidatePaste();break;
  case 'services-open':servicesOpen();break;
  case 'services-apply':servicesApply();break;
  case 'pickup-open':pickupOpen();break;
  case 'pickup-apply':pickupApply();break;
  case 'pickup-remove':state.pickups=state.pickups.filter(p=>p.key!==el.dataset.key);message('Точка вывоза убрана. Состав доставок сохранён.');break;
  case 'customer-open':customerOpen();break;
  case 'customer-apply':customerApply();break;
  case 'origin-open':originOpen();break;
  case 'origin-apply':originApply();break;
  case 'return-open':returnOpen();break;
  case 'return-apply':state.returnTo=$('return-choice').value;closeDialog();message('Склад возврата изменён.');break;
  case 'delivery-open':deliveryOpen(el.dataset.id);break;
  case 'to-details':toDetails();break;
  case 'pending-source':closeDialog();setScreen('source');break;
  case 'continue-without':closeDialog();setScreen('details');break;
  case 'submit-request':submitRequest();break;
  case 'edit-request':editRequest();break;
  case 'discard-edits':discardEdits();break;
  case 'sheet-open':sheetOpen();break;
  case 'sheet-download':downloadFile(sheetHTML(),'Маршрутный-лист-Р-000128.html');notify('Маршрутный лист скачан.');break;
  case 'office-contact':openDialog('contact',ORIGINS[state.origin].office,'<p class="dialog-intro">Демонстрационный контакт: +7 900 000-00-10<br>transport@example.com</p>','<button class="primary" data-action="close-dialog">Понятно</button>');break;
  case 'cancel-open':openDialog('cancel','Отменить создание рейса?','<p class="dialog-intro">Можно сохранить черновик и вернуться к нему позже. Доставки останутся в реестре.</p>','<button class="secondary" data-action="cancel-save">Сохранить черновик</button><button class="primary" data-action="cancel-confirm">Отменить создание</button>');break;
  case 'cancel-save':persist(true);closeDialog();break;
  case 'cancel-confirm':closeDialog();try{localStorage.removeItem(STORAGE);}catch{}reset('blank');notify('Создание отменено. Доставки сохранены в реестре.');break;
  case 'new-trip':openDialog('new','Создать новый рейс?','<p class="dialog-intro">Текущий пример останется в скачанном маршрутном листе. Начнём с пустого состава.</p>',dialogButtons('new-confirm','Создать новый'));break;
  case 'new-confirm':closeDialog();reset('blank');break;
  case 'demo-help':helpOpen();break;
  case 'simulate-error':state.simulateError=true;closeDialog();notify('Следующая отправка покажет ошибку. Повторная попытка завершится успешно.');break;
  case 'clear-saved':try{localStorage.removeItem(STORAGE);}catch{}closeDialog();notify('Сохранение удалено. Закройте вкладку, чтобы не сохранять новые изменения.');break;
  case 'download-prototype':try{const res=await fetch(location.pathname);if(!res.ok)throw Error();downloadFile(await res.text(),'Рейс-вариант-8.html');notify('Автономный HTML скачан.');}catch{notify('Используйте меню браузера «Сохранить страницу» для скачивания HTML.',true);}break;
 }
});
$('modal').addEventListener('cancel',()=>{modalKind='';pasteResult=null;serviceDraft=null;});
function init(){
 const reloading=performance.getEntriesByType('navigation')[0]?.type==='reload';
 if(!params.has('example')||reloading){try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved?.version===1&&saved.state&&Object.keys(saved.state.members).every(id=>BYID.has(id))){state=saved.state;pointMode=saved.pointMode==='responsible'?'responsible':'directory';editingSnapshot=saved.editingSnapshot||null;example=state.status==='accepted'?'accepted':state.status==='requested'?'requested':'start';render();notify('Восстановлен сохранённый пример из этого браузера.');return;}}catch{}}
 reset(['start','blank','distributed','large','requested','accepted'].includes(example)?example:'start');
}
init();
</script>
